<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>自分スキャン - AI疲労診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --accent: #fb923c; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .bg-app-gradient {
      background: linear-gradient(165deg, #FDE8E1 0%, #FDF3EE 42%, #E8EEFB 100%);
    }
    .wave-dot {
      width: 6px; height: 6px; border-radius: 9999px; background: #34D399;
      transform-origin: center bottom;
      transition: transform 0.08s ease-out, opacity 0.08s ease-out;
    }
    .material-icons { font-size: 22px; vertical-align: middle; }
    .mic-icon { font-size: 32px !important; color: #ef4444; }
    .stop-icon { font-size: 28px !important; color: #ef4444; }
    .fade-in { animation: fadeIn 0.4s ease-out both; }
    .slide-up { animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #resultScreen.entering { animation: resultEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes resultEnter {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #progressBar {
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mic-pulse {
      box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.45);
      animation: micPulse 1.6s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.45); }
      70% { box-shadow: 0 0 0 14px rgba(248, 113, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
    }
    .score-bar {
      height: 4px; border-radius: 9999px; background: #f1f5f9; overflow: hidden;
    }
    .score-bar > i {
      display: block; height: 100%; border-radius: 9999px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="bg-slate-200 flex justify-center items-center min-h-screen">

  <div class="w-full max-w-md h-[844px] max-h-[100dvh] bg-app-gradient shadow-2xl rounded-[40px] overflow-hidden flex flex-col relative border-4 border-white/40">

    <!-- SCAN -->
    <div id="scanScreen" class="flex-1 flex flex-col p-5 relative min-h-0">
      <div class="pt-1 shrink-0">
        <div class="flex items-center justify-between mb-3">
          <button type="button" class="w-9 h-9 rounded-full bg-white/70 flex items-center justify-center text-slate-500 shadow-sm" aria-label="戻る">
            <span class="material-icons" style="font-size:20px">chevron_left</span>
          </button>
          <h1 class="text-slate-700 font-bold text-sm tracking-wide">自分スキャン</h1>
          <div class="w-9"></div>
        </div>
        <div class="space-y-1.5 px-1">
          <div class="flex justify-between text-[11px] text-slate-500 font-medium">

          <div class="w-full bg-white/60 rounded-full h-2 overflow-hidden border border-white/70">

          </div>
        </div>
      </div>

      <div class="flex-1 flex flex-col justify-center items-center text-center px-3 space-y-5 min-h-0">

          <span id="statusText" class="truncate">モデルを準備中...</span>
        </div>
        <h2 id="aiPromptText" class="text-[17px] font-bold text-slate-800 leading-relaxed max-w-[300px] min-h-[3.5em]">

        <div id="waveContainer" class="flex items-end justify-center gap-1.5 h-8 hidden" aria-hidden="true">

          <div class="wave-dot" data-i="1"></div>
          <div class="wave-dot" data-i="2"></div>
          <div class="wave-dot" data-i="3"></div>
          <div class="wave-dot" data-i="4"></div>

      </div>

      <div class="flex flex-col items-center pb-3 space-y-3 shrink-0">

          <span id="micInnerIcon" class="material-icons mic-icon">mic</span>
        </button>
        <p id="micHint" class="text-xs text-slate-400">モデル読み込み中...</p>
        <button id="viewResultBtn" type="button"
          class="hidden w-full py-3.5 bg-orange-400 hover:bg-orange-500 text-white font-bold rounded-2xl shadow-md fade-in">
          スキャン完了！結果を見る

      </div>
    </div>

    <!-- RESULT -->
    <div id="resultScreen" class="hidden flex-1 flex flex-col p-5 overflow-y-auto space-y-4 bg-[#FDF3EE] min-h-0">
      <div class="text-center pt-1 shrink-0">
        <h2 class="text-slate-700 font-bold text-base">診断結果</h2>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-sm border border-orange-100/60 text-center space-y-1.5 slide-up">
        <p class="text-[10px] font-bold text-slate-400 tracking-widest">TODAY'S WELL-BEING</p>
        <div class="flex justify-center items-baseline gap-0.5">
          <span id="scoreTotalVal" class="text-5xl font-black text-emerald-500">--</span>

            <div class="text-[10px] text-slate-400 font-medium">精神の疲れ</div>

          </div>
          <div class="bg-white rounded-2xl p-3 shadow-sm text-center border border-slate-100 space-y-1.5">

            <div class="score-bar"><i id="barPhysical" class="bg-orange-400" style="width:0%"></i></div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-4 shadow-sm border border-orange-100 space-y-2.5 slide-up" style="animation-delay:0.12s">

        <div id="recoveryList" class="space-y-2"></div>

      <button type="button" onclick="location.reload()" class="w-full py-3.5 bg-slate-800 text-white text-xs font-bold rounded-2xl shadow-md mt-1 shrink-0">

    </div>

    <!-- NAV -->
    <div class="bg-white/85 backdrop-blur border-t border-slate-100 py-2.5 px-4 flex justify-between items-center text-slate-400 shrink-0">

      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">menu_book</span><span>知る</span>
      </div>
      <div class="flex flex-col items-center text-[10px] text-orange-400 font-bold space-y-0.5">
        <span class="material-icons" style="font-size:20px;color:#fb923c">waves</span><span>スキャン</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">favorite_border</span><span>ケア</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">person_outline</span><span>私</span>
      </div>
    </div>
  </div>

  <script type="module">
    // =========================================================
    // 自分スキャン — 完全版
    // =========================================================
    const BACKEND_URL = "https://voicechat-gz4j.onrender.com";
    const MODEL_ID = "wmoto-ai/moonshine-tiny-ja-ONNX";
    const EMBED_MODEL = "Xenova/paraphrase-multilingual-MiniLM-L12-v2";

    // 録音: 考えながら話せるよう緩めに
    const SILENCE_THRESHOLD = 0.011;
    const SILENCE_MS = 2200;
    const POST_TTS_GAP_MS = 420;
    const EMBED_WEIGHT = 0.80;
    const ACOUSTIC_WEIGHT = 0.20;

    // ---------- 状態 ----------
    let model = null, processor = null, tokenizer = null;
    let extractor = null;
    let defVectors = null;
    let isModelReady = false;
    let isEmbedReady = false;
    let isRecording = false;
    let isSpeaking = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let silenceStart = null;
    let waveRaf = null;
    let currentTurn = 0;
    let allUserTexts = [];
    let lastAudioBlob = null; // LightGBM用に最後の音声を保持
    let conversationLog = [];
    let lastAcoustic = {};
    let currentOpening = "";
    let loadCopyTimer = null;

    // ---------- DOM ----------
    const statusText    = document.getElementById("statusText");
    const aiPromptText  = document.getElementById("aiPromptText");
    const progressBar   = document.getElementById("progressBar");
    const progressText  = document.getElementById("progressText");
    const micBtn        = document.getElementById("micBtn");
    const micHint       = document.getElementById("micHint");
    const micInnerIcon  = document.getElementById("micInnerIcon");
    const waveContainer = document.getElementById("waveContainer");
    const waveDots      = [...waveContainer.querySelectorAll(".wave-dot")];
    const viewResultBtn = document.getElementById("viewResultBtn");
    const recoveryList  = document.getElementById("recoveryList");
    const scanScreen    = document.getElementById("scanScreen");
    const resultScreen  = document.getElementById("resultScreen");

    // ---------- オープニング（具体・答えやすい） ----------
    const OPENINGS = [
      "こんにちは。今日いちばん体に感じていることをひとこと教えてください。たとえば「肩がこってる」や「目がしょぼしょぼ」でも大丈夫です。",
      "お疲れさまです。朝から今までで、ちょっとしんどいなと思った場面はありましたか？",
      "こんにちは。今の気分を天気に例えるなら、晴れ・くもり・雨のどれに近いですか？",
      "少しだけお話ししてもいいですか。最近、集中が途切れやすいことや、体が重いことはありますか？",
      "こんにちは。仕事や勉強のあと、体と頭、どちらが先に疲れやすいですか？",
      "今日の自分を0から10で表すなら、何点くらいの調子ですか？ ざっくりで大丈夫です。",
      "お疲れさまです。昨夜の睡眠や今朝の目覚めは、いつもの自分と比べてどうでしたか？",
      "こんにちは。いま一番ほしいものは、休み・食事・誰かとの話・何もしない時間、どれに近いですか？",
      "こんにちは。今、目・肩・頭・気持ちのうち、いちばん気になるところはどこですか？",
      "お疲れさまです。今日は「動けない疲れ」と「考えたくない疲れ」、どちらに近い感じがしますか？"
    ];

    const LOAD_COPIES = [
      "AIが耳を澄ます準備をしています…",
      "言葉のニュアンスを読み解く準備中…",
      "やさしく聞くモードを整えています…",
      "あなたの声の特徴を受け取る準備中…",
      "まもなくお話しできます…"
    ];

    // ---------- システムプロンプト ----------
    const SYSTEM_BASE = `あなたは疲労スキャンのための、短くて温かい聞き手です。
厳守ルール:
- 必ず日本語。全体で60文字以内。1〜2文だけ。
- 質問は最大1つ。箇条書き・説明・診断名・スコア・医学的断定は禁止。
- ユーザーが使ったキーワード（部位・感情・数字など）を一度オウム返ししてから共感する。
- 短く答えても責めない。`;

    function buildTurnSystem(phase, openingText) {
      if (phase === "followup") {
        return `${SYSTEM_BASE}
今は2回目の発話です。最初の問いかけは次でした:「${openingText}」
手順: ①ユーザーの言葉を短く受け止める ②最初の質問と違う角度で、やさしい深掘りを1つだけ。
禁止: 「調子はどうですか？」など最初と同じ聞き直し。
良い例: 「肩がこってるんですね。それは朝から続いていますか？」
悪い例: 「今日の調子はどうですか？」`;
      }
      return `${SYSTEM_BASE}
最後の発話です。これまでの内容を1文で受け止め、「話してくれてありがとう」と伝えて終えてください。
新しい質問は禁止。診断やスコアには触れない。40文字以内。`;
    }

    // ---------- 疲労プロトタイプ（口語・複合症状を拡充） ----------
    const FATIGUE_DEFS = {
      body: [
        "体が重い、だるい、肩や首や腰が張って動くのがつらい",
        "朝起きたときに体が軽く感じられない、体力が落ちたように思う",
        "目がしょぼしょぼする、まぶたが重い、目の奥が疲れる",
        "いつもより動くことが負担、立ち仕事や歩行で足が鉛のよう",
        "筋肉の張りや違和感、体のどこかがこわばっている",
        "眠いというより体が鉛のようで横になりたい",
        "頭痛や肩こりが続いている、姿勢を保つのがつらい",
        "食欲がないわけではないが体がついてこない感じ"
      ],
      brain: [
        "頭がぼんやりして集中できない、ミスが増えたように感じる",
        "情報を整理したり思い出す作業が難しく感じる",
        "何も考えたくない、頭を使いたくない",
        "画面を見続けるとすぐ疲れる、注意が途切れやすい",
        "判断にいつもより時間がかかる、考えがまとまらない",
        "言葉が出にくい、話の要点をつかむのが大変",
        "同じことを何度も確認してしまう、忘れっぽい",
        "頭の回転が遅い感じ、頭にモヤがかかっている"
      ],
      mental: [
        "気持ちが休まらない、イライラする、気分が落ち込む",
        "プレッシャーを感じて心が疲れている、気分が揺れやすい",
        "やる気が出ない、何をするにも気が重い",
        "不安が続きリラックスできない、気持ちの切り替えが難しい",
        "人と話すのが少し負担、一人になりたい気持ちがある",
        "些細なことで腹が立つ、感情のコントロールが難しい",
        "落ち込みやすく、前向きな気持ちが続かない",
        "心がざわついて落ち着かない、休息しても回復感がない"
      ],
      healthy: [
        "特に疲れはなく調子がよい、体も頭も軽く感じる",
        "集中できて気分も安定している、いつも通り元気だ",
        "睡眠も食欲も問題なく無理なく一日を過ごせている",
        "ストレスはあるがコントロールできて休息も取れている",
        "体も気持ちもすっきりしていて前向きに動けている",
        "別につらくない、特に気になる不調はない"
      ]
    };

    const RECOVERY = {
      body: [
        { icon: "self_improvement", color: "#ea580c", bg: "bg-orange-100", title: "軽いストレッチ", desc: "座ったまま肩・首をゆっくり回す（3分）" },
        { icon: "hot_tub", color: "#0284c7", bg: "bg-sky-100", title: "温活", desc: "ぬるめのお湯で体の芯を温める" },
        { icon: "hotel", color: "#7c3aed", bg: "bg-violet-100", title: "短い仮眠", desc: "15〜20分の昼寝で体を休める" },
        { icon: "visibility_off", color: "#0f766e", bg: "bg-teal-100", title: "目を休める", desc: "画面を閉じ、遠くを1分見る" }
      ],
      brain: [
        { icon: "visibility", color: "#0891b2", bg: "bg-cyan-100", title: "画面から離れる", desc: "5〜10分、遠くを見て目と頭を休める" },
        { icon: "directions_walk", color: "#16a34a", bg: "bg-green-100", title: "短い散歩", desc: "外の空気を吸って頭を切り替える" },
        { icon: "schedule", color: "#ca8a04", bg: "bg-yellow-100", title: "判断を後回し", desc: "難しい判断は後で、簡単な作業だけにする" },
        { icon: "timer", color: "#64748b", bg: "bg-slate-100", title: "ポモドーロ休息", desc: "25分集中したら5分完全に休む" }
      ],
      mental: [
        { icon: "air", color: "#2563eb", bg: "bg-blue-100", title: "深呼吸", desc: "4秒吸って6秒吐く呼吸を5回" },
        { icon: "edit_note", color: "#db2777", bg: "bg-pink-100", title: "気持ちの書き出し", desc: "今気になっていることをメモに出すだけ" },
        { icon: "music_note", color: "#9333ea", bg: "bg-purple-100", title: "好きな休息", desc: "何もしない時間を10分つくる" },
        { icon: "chat_bubble_outline", color: "#ea580c", bg: "bg-orange-50", title: "誰かと話す", desc: "信頼できる人に一言だけ近況を共有する" }
      ],
      general: [
        { icon: "local_drink", color: "#0d9488", bg: "bg-teal-100", title: "水分補給", desc: "常温の水をゆっくり飲む" },
        { icon: "bedtime", color: "#4f46e5", bg: "bg-indigo-100", title: "早めの就寝準備", desc: "いつもより30分早く寝る準備を始める" }
      ]
    };

    // =========================================================
    // テキスト前処理・程度/否定補正
    // =========================================================
    const FILLER_RE = /^(えっと|えー|あの|その|まあ|なんか|こう|はい|うん|うーん)+/g;
    const FILLER_MID_RE = /(えっと|えー+|あのー*|そのー*|なんか|こう)/g;

    const SYNONYM_MAP = [
      [/しんどい|へろへろ|くたくた|げっそり/g, "疲れている"],
      [/だるい|体が重い|鉛みたい|鉛のよう/g, "体が重い"],
      [/しょぼしょぼ|しょぼい|目が重い/g, "目が疲れた"],
      [/イライラ|いらいら|むかつく|腹が立つ/g, "イライラする"],
      [/ぼーっと|ぼんやり|頭が真っ白/g, "集中できない"],
      [/なんもしたくない|何もしたくない|考えたくない/g, "何も考えたくない"],
      [/ねむい|眠い|眠たい/g, "眠い"],
      [/つかれた|疲れた|疲労/g, "疲れている"]
    ];

    function preprocessText(raw) {
      if (!raw) return "";
      let t = String(raw).normalize("NFKC").trim();
      t = t.replace(FILLER_RE, "").replace(FILLER_MID_RE, "");
      t = t.replace(/[、,]{2,}/g, "、").replace(/\s+/g, " ").trim();
      for (const [re, rep] of SYNONYM_MAP) t = t.replace(re, rep);
      return t;
    }

    /**
     * 程度・否定のヒューリスティック補正係数
     * return: { scale: 0.4〜1.35, negated: boolean, intensity: 'low'|'mid'|'high' }
     */
    function analyzeModifiers(text) {
      const t = text || "";
      let scale = 1.0;
      let negated = false;
      let intensity = "mid";

      // 否定（疲労の否定）
      if (/(つらくない|疲れてない|疲れていない|大丈夫|問題ない|平気|気にならない|別につら|そんなに(疲れ|つら|しんど)|特に(ない|問題|疲れ))/.test(t)) {
        negated = true;
        scale *= 0.45;
      }
      // 部分否定
      if (/(あまり|そんなに|あまり〜ない)/.test(t) && /(疲れ|つら|しんど|重|だる)/.test(t)) {
        scale *= 0.7;
      }

      // 弱い程度
      if (/(少し|ちょっと|やや|軽く|たまに)/.test(t)) {
        scale *= 0.75;
        intensity = "low";
      }
      // 強い程度
      if (/(かなり|とても|すごく|めっちゃ|本当に|すごく|ひどく|限界|もう無理|かなりしんど)/.test(t)) {
        scale *= 1.28;
        intensity = "high";
      }
      if (/(ずっと|一日中|朝から|続いて)/.test(t)) {
        scale *= 1.12;
      }

      scale = Math.max(0.4, Math.min(1.35, scale));
      return { scale, negated, intensity };
    }

    // =========================================================
    // 埋め込み
    // =========================================================
    async function loadEmbedder(onProgress) {
      try {
        if (onProgress) onProgress("言葉のニュアンスを読み解く準備中…");
        const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0");
        extractor = await pipeline("feature-extraction", EMBED_MODEL, {
          dtype: "q8",
          device: "wasm"
        });
        defVectors = {};
        for (const [key, texts] of Object.entries(FATIGUE_DEFS)) {
          const vecs = [];
          for (const t of texts) {
            const out = await extractor(t, { pooling: "mean", normalize: true });
            vecs.push(Array.from(out.data));
          }
          defVectors[key] = vecs;
        }
        isEmbedReady = true;
      } catch (e) {
        console.warn("埋め込み読み込み失敗", e);
        isEmbedReady = false;
      }
    }

    function cosine(a, b) {
      let s = 0;
      const n = Math.min(a.length, b.length);
      for (let i = 0; i < n; i++) s += a[i] * b[i];
      return s;
    }

    function simToCategory(userVec, prototypes) {
      const sims = prototypes.map(p => cosine(userVec, p));
      const maxS = Math.max(...sims);
      const meanS = sims.reduce((a, b) => a + b, 0) / sims.length;
      return 0.7 * maxS + 0.3 * meanS;
    }

    /** 音響特徴 → 簡易疲労寄与 0〜100 */
    function acousticFatigueProxy(f) {
      if (!f || typeof f !== "object" || !Object.keys(f).length) return null;
      const get = (...keys) => {
        for (const k of keys) {
          if (f[k] != null && Number.isFinite(Number(f[k]))) return Number(f[k]);
        }
        // prefix なし / smile_ 両対応
        for (const k of Object.keys(f)) {
          for (const want of keys) {
            if (k.endsWith(want) || k.includes(want)) {
              const v = Number(f[k]);
              if (Number.isFinite(v)) return v;
            }
          }
        }
        return null;
      };

      const loud = get("loudness_sma3_amean", "smile_loudness_sma3_amean");
      const jitter = get("jitterLocal_sma3nz_amean", "smile_jitterLocal_sma3nz_amean");
      const hnr = get("HNRdBACF_sma3nz_amean", "smile_HNRdBACF_sma3nz_amean");
      const flux = get("spectralFlux_sma3_amean", "smile_spectralFlux_sma3_amean");

      // 経験的: 小さい声・高いjitter・低いHNR → 疲労寄り
      let score = 50;
      if (loud != null) score += (0.35 - loud) * 60;
      if (jitter != null) score += (jitter - 0.02) * 400;
      if (hnr != null) score += (8 - hnr) * 2.5;
      if (flux != null) score += (flux - 0.15) * 40;
      return Math.max(20, Math.min(88, Math.round(score)));
    }

    function heuristicTextScores(text) {
      const t = text || "";
      let physical = 42, brain = 42, mental = 42;
      if (/だる|重い|肩こり|腰痛|眠い|体力|こわば|張|目が疲|しょぼ/.test(t)) physical += 22;
      if (/集中|ぼんやり|ミス|頭|忘れ|整理|判断|考えたくない|モヤ/.test(t)) brain += 22;
      if (/イライラ|落ち[込こ]|不安|ストレス|つらい|気[がも]重|やる気|ざわ/.test(t)) mental += 20;
      if (/元気|調子いい|大丈夫|問題ない|すっきり|快調|つらくない/.test(t)) {
        physical -= 18; brain -= 18; mental -= 18;
      }
      const mod = analyzeModifiers(t);
      physical = Math.max(15, Math.min(92, Math.round(physical * mod.scale)));
      brain = Math.max(15, Math.min(92, Math.round(brain * mod.scale)));
      mental = Math.max(15, Math.min(92, Math.round(mental * mod.scale)));
      if (mod.negated) {
        physical = Math.min(physical, 40);
        brain = Math.min(brain, 40);
        mental = Math.min(mental, 40);
      }
      const total = Math.round(100 - (physical + brain + mental) / 3 * 0.88);
      return { physical, brain, mental, total: Math.max(22, Math.min(92, total)) };
    }

    async function scoreFromText(userText, acoustic) {
      const cleaned = preprocessText(userText);
      const mod = analyzeModifiers(userText || cleaned);

      let embedScores;
      if (!isEmbedReady || !extractor || !defVectors) {
        embedScores = heuristicTextScores(cleaned);
      } else {
        try {
          const out = await extractor(cleaned || "特になし", { pooling: "mean", normalize: true });
          const v = Array.from(out.data);
          const raw = {
            body: simToCategory(v, defVectors.body),
            brain: simToCategory(v, defVectors.brain),
            mental: simToCategory(v, defVectors.mental),
            healthy: simToCategory(v, defVectors.healthy)
          };
          const toPct = (c) => Math.max(12, Math.min(93, Math.round(48 + c * 160)));
          let physical = toPct(raw.body - raw.healthy);
          let brain = toPct(raw.brain - raw.healthy);
          let mental = toPct(raw.mental - raw.healthy);

          // 程度・否定補正
          physical = Math.max(12, Math.min(93, Math.round(physical * mod.scale)));
          brain = Math.max(12, Math.min(93, Math.round(brain * mod.scale)));
          mental = Math.max(12, Math.min(93, Math.round(mental * mod.scale)));
          if (mod.negated) {
            physical = Math.min(physical, 38);
            brain = Math.min(brain, 38);
            mental = Math.min(mental, 38);
          }

          const avgFatigue = (physical + brain + mental) / 3;
          const total = Math.max(18, Math.min(95, Math.round(100 - avgFatigue * 0.88)));
          embedScores = { physical, brain, mental, total, raw };
        } catch (e) {
          console.warn("埋め込みスコア失敗", e);
          embedScores = heuristicTextScores(cleaned);
        }
      }

      // 音響ハイブリッド
      const ac = acousticFatigueProxy(acoustic || lastAcoustic);
      if (ac != null) {
        const blend = (e) => Math.round(e * EMBED_WEIGHT + ac * ACOUSTIC_WEIGHT);
        embedScores = {
          ...embedScores,
          physical: blend(embedScores.physical),
          brain: blend(embedScores.brain),
          mental: blend(embedScores.mental)
        };
        const avg = (embedScores.physical + embedScores.brain + embedScores.mental) / 3;
        embedScores.total = Math.max(18, Math.min(95, Math.round(100 - avg * 0.88)));
        embedScores.acousticProxy = ac;
      }

      return embedScores;
    }



    // ===== LightGBMバックエンド版スコア取得 (91次元対応) =====
    async function scoreFromBackend(audioBlob, text) {
      if (!audioBlob) throw new Error("no audio blob");
      const form = new FormData();
      form.append("file", audioBlob, "recording.webm");
      form.append("text", text || "");
      const res = await fetch(`${BACKEND_URL}/predict-fatigue`, {
        method: "POST",
        body: form
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error("backend predict failed: " + t);
      }
      const data = await res.json();
      return {
        physical: Math.round(data.physical),
        brain: Math.round(data.brain),
        mental: Math.round(data.mental),
        total: Math.round(data.total),
        raw: data,
        source: "lightgbm-91d"
      };
    }

    async function scoreWithFallback(userText, acoustic, audioBlob) {
      if (audioBlob) {
        try {
          statusText.textContent = "疲労度モデル(91次元)で分析中...";
          const backendScores = await scoreFromBackend(audioBlob, userText);
          console.log("[LightGBM-91D] success", backendScores);
          return backendScores;
        } catch (e) {
          console.warn("[LightGBM-91D] failed, fallback to embedding:", e);
        }
      }
      return await scoreFromText(userText, acoustic);
    }


    function pickRecovery(scores) {
      const entries = [
        ["body", scores.physical],
        ["brain", scores.brain],
        ["mental", scores.mental]
      ].sort((a, b) => b[1] - a[1]);
      const list = [];
      const [topKey] = entries[0];
      const [secKey, secVal] = entries[1];
      list.push(...RECOVERY[topKey].slice(0, 2));
      if (secVal >= 55) list.push(RECOVERY[secKey][0]);
      const avg = (scores.physical + scores.brain + scores.mental) / 3;
      list.push(avg >= 60 ? RECOVERY.general[1] : RECOVERY.general[0]);
      const seen = new Set();
      const unique = [];
      for (const item of list) {
        if (!seen.has(item.title)) { seen.add(item.title); unique.push(item); }
      }
      return { topKey, suggestions: unique.slice(0, 4) };
    }

    async function blobToFloat32(blob) {
      const ab = await blob.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const buf = await ctx.decodeAudioData(ab);
      let data = buf.getChannelData(0);
      if (buf.sampleRate !== 16000) {
        const offline = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
        const src = offline.createBufferSource();
        src.buffer = buf;
        src.connect(offline.destination);
        src.start();
        const rendered = await offline.startRendering();
        data = rendered.getChannelData(0);
      }
      return new Float32Array(data);
    }

    async function transcribe(float32) {
      const inputs = await processor(float32);
      const outputs = await model.generate({ ...inputs, max_new_tokens: 96 });
      return tokenizer.decode(outputs[0], { skip_special_tokens: true }).trim() || "（聞き取れませんでした）";
    }

      const data = await res.json();
      return data.text || data.choices?.[0]?.message?.content || "";
    }

    /** 診断JSONを厳密にパース。失敗時はフォールバック */
    function parseDiagnosisJSON(raw, scores) {
      const fallbackTitle = titleFromScores(scores);
      const fallbackDetail = "今日の話をありがとう。無理せず、できる範囲で休んでみてください。";
      if (!raw) return { title: fallbackTitle, detail: fallbackDetail };

      // コードフェンス除去
      let s = raw.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
      // 最初の { ... } を抽出
      const m = s.match(/\{[\s\S]*\}/);
      if (m) s = m[0];
      try {
        const obj = JSON.parse(s);
        const title = (obj.title || obj.タイトル || "").toString().trim();
        const detail = (obj.detail || obj.詳細 || obj.body || "").toString().trim();
        return {
          title: title || fallbackTitle,
          detail: detail || fallbackDetail
        };
      } catch {
        // 行ベースの旧形式フォールバック
        const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
        const titleLine = lines.find(l => /タイトル/.test(l));
        const detailLines = lines.filter(l => !/タイトル/.test(l));
        return {
          title: titleLine ? titleLine.replace(/.*タイトル[：:\s]*/, "").trim() : fallbackTitle,
          detail: detailLines.join(" ").replace(/.*詳細[：:\s]*/, "").trim() || fallbackDetail
        };
      }
    }

    function updateWaveFromRms(rms) {
      // rms ~ 0.005〜0.12 を 1〜7 スケールに
      const level = Math.min(1, Math.max(0, (rms - 0.004) / 0.08));
      waveDots.forEach((dot, i) => {
        const center = (waveDots.length - 1) / 2;
        const dist = Math.abs(i - center) / center;
        const h = 6 + level * (22 - dist * 10);
        const op = 0.35 + level * 0.65;
        dot.style.transform = `scaleY(${h / 6})`;
        dot.style.opacity = String(op);
      });
    }

    function stopWaveAnim() {
      if (waveRaf) { cancelAnimationFrame(waveRaf); waveRaf = null; }
      waveDots.forEach(d => {
        d.style.transform = "scaleY(1)";
        d.style.opacity = "0.45";
      });
    }

    async function startRecording() {
      if (!isModelReady || isRecording || isSpeaking) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          stopWaveAnim();
          if (audioContext) { try { await audioContext.close(); } catch {} audioContext = null; }
          await processTurn();
        };

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        mediaRecorder.start(200);
        isRecording = true;
        silenceStart = null;
        waveContainer.classList.remove("hidden");
        statusText.textContent = "あなたのお話を聞いています...";
        setMicUI(true);
        loopMonitor();
      } catch (e) {
        console.error(e);
        statusText.textContent = "マイクの許可が必要です";
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      waveContainer.classList.add("hidden");
      statusText.textContent = "認識中...";
      setMicUI(false);
      mediaRecorder.stop();
    }

    function loopMonitor() {
      if (!isRecording || !analyser) return;
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      updateWaveFromRms(rms);

      if (rms < SILENCE_THRESHOLD) {
        if (!silenceStart) silenceStart = Date.now();
        else if (Date.now() - silenceStart > SILENCE_MS) {
          stopRecording();
          return;
        }
      } else {
        silenceStart = null;
      }
      waveRaf = requestAnimationFrame(loopMonitor);
    }

    function afterSpeakThenRecord() {
      setTimeout(() => {
        if (isModelReady && currentTurn < 2 && !viewResultBtn.classList.contains("hidden") === false) {

      }, POST_TTS_GAP_MS);
    }

            {
              role: "system",
              content: `あなたは優しいアドバイザーです。発言と疲労スコアに一貫した短いアドバイスを出してください。
出力は必ず次のJSONのみ（前置き・後書き・コードフェンス禁止）:
{"title":"〇〇な疲れ","detail":"ユーザーに語りかける2〜3文。〜かもしれません／〜してみてください を使う"}
titleはスコアの一番高い軸と矛盾しないこと。`
            },
            {
              role: "user",
              content: `【疲労スコア】身体:${scores.physical} 脳:${scores.brain} 精神:${scores.mental} 総合ウェルビーイング:${scores.total}
【会話】
${conversationLog.map(m => (m.role === "user" ? "ユーザー" : "AI") + "：" + m.content).join("\n")}`
            }
          ];
          const diagnosisRaw = await callLLM(diagnosisMessages);
          const { title, detail } = parseDiagnosisJSON(diagnosisRaw, scores);

          document.getElementById("fatigueTitle").textContent = title;
          document.getElementById("fatigueDetailText").textContent = detail;
          applyScoreUI(scores);
          renderRecovery(recovery.suggestions);

          updateProgress(100, "100%");
          statusText.textContent = "スキャン完了";
          micBtn.classList.add("hidden");
          viewResultBtn.classList.remove("hidden");

          speakAI(summary + "。結果をご覧ください。");
        }
      } catch (e) {
        console.error(e);
        statusText.textContent = "エラーが発生しました。もう一度どうぞ";
        setMicUI(false);
        isRecording = false;
      }
    }

    // =========================================================
    // TTS（Edge・リトライ・ブラウザ標準なし）
    // =========================================================
    async function speakAI(text, onEnd, retries = 1) {
      if (!text || !String(text).trim()) {
        if (onEnd) onEnd();
        return;
      }
      isSpeaking = true;
      const prevStatus = statusText.textContent;
      statusText.textContent = "AIが話しています...";
      micBtn.disabled = true;
      micBtn.classList.add("opacity-50");

      try {
        const url = `${BACKEND_URL}/tts?text=${encodeURIComponent(text)}&voice=ja-JP-NanamiNeural`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("TTS failed: " + res.status);

        const blob = await res.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);

        const finish = () => {
          URL.revokeObjectURL(audioUrl);
          statusText.textContent = prevStatus;
          isSpeaking = false;
          if (isModelReady && viewResultBtn.classList.contains("hidden")) {
            micBtn.disabled = false;
            micBtn.classList.remove("opacity-50");
          }
          if (onEnd) onEnd();
        };
        audio.onended = finish;
        audio.onerror = finish;
        await audio.play();
      } catch (e) {
        console.warn("Edge TTS失敗", e);
        if (retries > 0) {
          statusText.textContent = "音声の準備中...";
          await new Promise(r => setTimeout(r, 1500));
          return speakAI(text, onEnd, retries - 1);
        }
        statusText.textContent = "音声を再生できませんでした";
        isSpeaking = false;
        if (isModelReady) {
          micBtn.disabled = false;
          micBtn.classList.remove("opacity-50");
        }
        if (onEnd) onEnd();
      }
    }

    // =========================================================
    // イベント
    // =========================================================
    micBtn.addEventListener("click", () => {
      if (!isModelReady || isSpeaking) return;
      if (isRecording) stopRecording();
      else startRecording();
    });

    viewResultBtn.addEventListener("click", () => {
      scanScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      resultScreen.classList.add("entering");
    });

    loadModel();
  </script>
</body>
