<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>自分スキャン - AI疲労診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root { --accent: #fb923c; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .bg-app-gradient {
      background: linear-gradient(165deg, #FDE8E1 0%, #FDF3EE 42%, #E8EEFB 100%);
    }
    .wave-dot {
      width: 6px; height: 6px; border-radius: 9999px; background: #34D399;
      transform-origin: center bottom;
      transition: transform 0.08s ease-out, opacity 0.08s ease-out;
    }
    .material-icons { font-size: 22px; vertical-align: middle; }
    .mic-icon { font-size: 32px !important; color: #ef4444; }
    .stop-icon { font-size: 28px !important; color: #ef4444; }
    .fade-in { animation: fadeIn 0.4s ease-out both; }
    .slide-up { animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #resultScreen.entering { animation: resultEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes resultEnter {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    #progressBar {
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mic-pulse {
      box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.45);
      animation: micPulse 1.6s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.45); }
      70% { box-shadow: 0 0 0 14px rgba(248, 113, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); }
    }
    .score-bar {
      height: 4px; border-radius: 9999px; background: #f1f5f9; overflow: hidden;
    }
    .score-bar > i {
      display: block; height: 100%; border-radius: 9999px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="bg-slate-200 flex justify-center items-center min-h-screen">

  <div class="w-full max-w-md h-[844px] max-h-[100dvh] bg-app-gradient shadow-2xl rounded-[40px] overflow-hidden flex flex-col relative border-4 border-white/40">

    <!-- SCAN -->
    <div id="scanScreen" class="flex-1 flex flex-col p-5 relative min-h-0">
      <div class="pt-1 shrink-0">
        <div class="flex items-center justify-between mb-3">
          <button type="button" class="w-9 h-9 rounded-full bg-white/70 flex items-center justify-center text-slate-500 shadow-sm" aria-label="戻る">
            <span class="material-icons" style="font-size:20px">chevron_left</span>
          </button>
          <h1 class="text-slate-700 font-bold text-sm tracking-wide">自分スキャン</h1>
          <div class="w-9"></div>
        </div>
        <div class="space-y-1.5 px-1">
          <div class="flex justify-between text-[11px] text-slate-500 font-medium">
            <span>スキャン進行度</span>
            <span id="progressText">0%</span>
          </div>
          <div class="w-full bg-white/60 rounded-full h-2 overflow-hidden border border-white/70">
            <div id="progressBar" class="bg-emerald-400 h-full rounded-full" style="width:0%"></div>
          </div>
        </div>
      </div>

      <div class="flex-1 flex flex-col justify-center items-center text-center px-3 space-y-5 min-h-0">
        <div class="inline-flex items-center gap-2 bg-white/85 backdrop-blur px-4 py-1.5 rounded-full text-xs text-slate-600 shadow-sm max-w-[95%]">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
          <span id="statusText" class="truncate">モデルを準備中...</span>
        </div>
        <h2 id="aiPromptText" class="text-[17px] font-bold text-slate-800 leading-relaxed max-w-[300px] min-h-[3.5em]">
          準備ができたら<br>下のボタンを押してください
        </h2>
        <div id="waveContainer" class="flex items-end justify-center gap-1.5 h-8 hidden" aria-hidden="true">
          <div class="wave-dot" data-i="0"></div>
          <div class="wave-dot" data-i="1"></div>
          <div class="wave-dot" data-i="2"></div>
          <div class="wave-dot" data-i="3"></div>
          <div class="wave-dot" data-i="4"></div>
          <div class="wave-dot" data-i="5"></div>
          <div class="wave-dot" data-i="6"></div>
        </div>
      </div>

      <div class="flex flex-col items-center pb-3 space-y-3 shrink-0">
        <button id="micBtn" type="button" disabled
          class="w-[78px] h-[78px] rounded-full bg-white border-[5px] border-red-400 flex items-center justify-center shadow-lg transition-all active:scale-95 opacity-50"
          aria-label="録音開始">
          <span id="micInnerIcon" class="material-icons mic-icon">mic</span>
        </button>
        <p id="micHint" class="text-xs text-slate-400">モデル読み込み中...</p>
        <button id="viewResultBtn" type="button"
          class="hidden w-full py-3.5 bg-orange-400 hover:bg-orange-500 text-white font-bold rounded-2xl shadow-md fade-in">
          スキャン完了！結果を見る

      </div>
    </div>

    <!-- RESULT -->
    <div id="resultScreen" class="hidden flex-1 flex flex-col p-5 overflow-y-auto space-y-4 bg-[#FDF3EE] min-h-0">
      <div class="text-center pt-1 shrink-0">
        <h2 class="text-slate-700 font-bold text-base">診断結果</h2>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-sm border border-orange-100/60 text-center space-y-1.5 slide-up">
        <p class="text-[10px] font-bold text-slate-400 tracking-widest">TODAY'S WELL-BEING</p>
        <div class="flex justify-center items-baseline gap-0.5">
          <span id="scoreTotalVal" class="text-5xl font-black text-emerald-500">--</span>
          <span class="text-base font-bold text-slate-400">/100</span>
        </div>

      <div class="space-y-2 slide-up" style="animation-delay:0.06s">

        <div class="grid grid-cols-3 gap-2.5">

            <div id="scoreBrainVal" class="text-xl font-black text-slate-700">--<span class="text-xs font-normal">%</span></div>

            <div class="score-bar"><i id="barMental" class="bg-violet-400" style="width:0%"></i></div>
          </div>
          <div class="bg-white rounded-2xl p-3 shadow-sm text-center border border-slate-100 space-y-1.5">
            <div id="scorePhysicalVal" class="text-xl font-black text-orange-500">--<span class="text-xs font-normal">%</span></div>

      </div>

        </div>
        <div class="bg-orange-50/70 rounded-2xl p-3 border border-orange-100 text-center">
          <p class="text-[10px] text-orange-400 font-medium">一言で表すと、今のあなたは…</p>

        ホームに戻る

    <!-- NAV -->
    <div class="bg-white/85 backdrop-blur border-t border-slate-100 py-2.5 px-4 flex justify-between items-center text-slate-400 shrink-0">
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">home</span><span>ホーム</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">menu_book</span><span>知る</span>
      </div>
      <div class="flex flex-col items-center text-[10px] text-orange-400 font-bold space-y-0.5">
        <span class="material-icons" style="font-size:20px;color:#fb923c">waves</span><span>スキャン</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">favorite_border</span><span>ケア</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">person_outline</span><span>私</span>
      </div>
    </div>

  <script type="module">

    // ===== アンサンブル版: 声 + 埋め込み =====
    async function scoreFromBackend(audioBlob, text, embedRaw) {
      if (!audioBlob) throw new Error("no audio blob");
      const form = new FormData();
      form.append("file", audioBlob, "recording.webm");
      form.append("text", text || "");
      if (embedRaw) {
        if (embedRaw.body !== undefined) form.append("sim_body", String(embedRaw.body));
        if (embedRaw.brain !== undefined) form.append("sim_brain", String(embedRaw.brain));
        if (embedRaw.mental !== undefined) form.append("sim_mental", String(embedRaw.mental));
        if (embedRaw.healthy !== undefined) form.append("sim_healthy", String(embedRaw.healthy));
      }
      const res = await fetch(`${BACKEND_URL}/predict-fatigue`, {
        method: "POST",
        body: form
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error("backend predict failed: " + t);
      }
      const data = await res.json();
      return {
        physical: Math.round(data.final.physical),
        brain: Math.round(data.final.brain),
        mental: Math.round(data.final.mental),
        total: Math.round(data.final.total),
        raw: data,
        voice: data.voice,
        embedding: data.embedding,
        source: "ensemble-voice+embedding"
      };
    }

    async function scoreWithFallback(userText, acoustic, audioBlob) {
      // 埋め込み生スコアを取得 (フロントのembeddingモデルがあれば)
      let embedRaw = null;
      try {
        if (isEmbedReady && extractor && defVectors) {
          const out = await extractor(userText || "特になし", { pooling: "mean", normalize: true });
          const v = Array.from(out.data);
          embedRaw = {
            body: simToCategory(v, defVectors.body),
            brain: simToCategory(v, defVectors.brain),
            mental: simToCategory(v, defVectors.mental),
            healthy: simToCategory(v, defVectors.healthy)
          };
        }
      } catch(e) { console.warn("embed raw failed", e); }

      if (audioBlob) {
        try {
          statusText.textContent = "声とテキストをアンサンブル分析中...";
          const backendScores = await scoreFromBackend(audioBlob, userText, embedRaw);
          console.log("[Ensemble] success", backendScores);
          return backendScores;
        } catch (e) {
          console.warn("[Ensemble] failed, fallback to embedding:", e);
        }
      }
      return await scoreFromText(userText, acoustic);
    }



    function pickRecovery(scores) {
      const entries = [
        ["body", scores.physical],
        ["brain", scores.brain],
        ["mental", scores.mental]
      ].sort((a, b) => b[1] - a[1]);
      const list = [];
      const [topKey] = entries[0];
      const [secKey, secVal] = entries[1];
      list.push(...RECOVERY[topKey].slice(0, 2));
      if (secVal >= 55) list.push(RECOVERY[secKey][0]);
      const avg = (scores.physical + scores.brain + scores.mental) / 3;
      list.push(avg >= 60 ? RECOVERY.general[1] : RECOVERY.general[0]);
      const seen = new Set();
      const unique = [];
      for (const item of list) {
        if (!seen.has(item.title)) { seen.add(item.title); unique.push(item); }
      }
      return { topKey, suggestions: unique.slice(0, 4) };
    }

    function renderRecovery(suggestions) {
      recoveryList.innerHTML = suggestions.map((s, i) => `
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex items-center gap-3 slide-up" style="animation-delay:${0.05 * i}s">
          <div class="w-12 h-12 rounded-xl ${s.bg} flex items-center justify-center shrink-0">
            <span class="material-icons" style="color:${s.color}">${s.icon}</span>
          </div>
          <div class="min-w-0">
            <p class="text-xs font-bold text-slate-700">${s.title}</p>
            <p class="text-[11px] text-slate-400">${s.desc}</p>
          </div>
        </div>
      `).join("");
    }

    function titleFromScores(scores) {
      const entries = [
        ["身体", scores.physical],
        ["脳", scores.brain],
        ["精神", scores.mental]
      ].sort((a, b) => b[1] - a[1]);
      const [name, val] = entries[0];
      if (val >= 72) return `${name}の強い疲れ`;
      if (val >= 55) return `${name}寄りの疲れ`;
      if (scores.total >= 72) return "比較的すっきりした状態";
      return "総合的な疲れ";
    }

    function applyScoreUI(scores) {
      document.getElementById("scoreTotalVal").textContent = scores.total;
      if (scores.source === "lightgbm") {
        document.getElementById("scoreHint").textContent = `アンサンブル推論 (身体:${scores.raw.physical_raw.toFixed(2)} 脳:${scores.raw.brain_raw.toFixed(2)} 精神:${scores.raw.mental_raw.toFixed(2)})`;
      } else {
        document.getElementById("scoreHint").textContent = `埋め込み推論 (フォールバック)`;
      }
      document.getElementById("scoreBrainVal").innerHTML = `${scores.brain}<span class="text-xs font-normal">%</span>`;
      document.getElementById("scoreMentalVal").innerHTML = `${scores.mental}<span class="text-xs font-normal">%</span>`;
      document.getElementById("scorePhysicalVal").innerHTML = `${scores.physical}<span class="text-xs font-normal">%</span>`;
      requestAnimationFrame(() => {
        document.getElementById("barBrain").style.width = scores.brain + "%";
        document.getElementById("barMental").style.width = scores.mental + "%";
        document.getElementById("barPhysical").style.width = scores.physical + "%";
      });
      const hint = scores.total >= 70 ? "比較的コンディションは良好です"
        : scores.total >= 50 ? "無理をせず、ペースを落として大丈夫です"
        : "休息を優先してあげてください";
      document.getElementById("scoreHint").textContent = hint;
    }

    // =========================================================
    // ローディングUX
    // =========================================================
    function startLoadCopyRotation() {
      let i = 0;
      statusText.textContent = LOAD_COPIES[0];
      loadCopyTimer = setInterval(() => {
        i = (i + 1) % LOAD_COPIES.length;
        statusText.textContent = LOAD_COPIES[i];
      }, 2200);
    }
    function stopLoadCopyRotation() {
      if (loadCopyTimer) { clearInterval(loadCopyTimer); loadCopyTimer = null; }
    }

    function updateProgress(p, label) {
      const clamped = Math.max(0, Math.min(100, p));
      progressBar.style.width = clamped + "%";
      progressText.textContent = label || (clamped + "%");
    }

    // =========================================================
    // STT / LLM / Acoustic
    // =========================================================
    async function loadModel() {
      try {
        startLoadCopyRotation();
        updateProgress(8, "8%");

        const { MoonshineForConditionalGeneration, AutoProcessor, AutoTokenizer, env } =
          await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0");
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        updateProgress(18, "18%");
        const embedP = loadEmbedder();

        updateProgress(28, "28%");
        [model, processor, tokenizer] = await Promise.all([
          MoonshineForConditionalGeneration.from_pretrained(MODEL_ID, { dtype: "fp32", device: "wasm" }),
          AutoProcessor.from_pretrained(MODEL_ID),
          AutoTokenizer.from_pretrained(MODEL_ID),
        ]);
        updateProgress(70, "70%");
        await embedP;
        updateProgress(92, "92%");

        stopLoadCopyRotation();
        isModelReady = true;
        statusText.textContent = "準備完了";
        currentOpening = OPENINGS[Math.floor(Math.random() * OPENINGS.length)];
        aiPromptText.innerHTML = currentOpening.replace(/。/g, "。<br>");
        conversationLog = [{ role: "assistant", content: currentOpening }];
        micBtn.disabled = false;
        micBtn.classList.remove("opacity-50");
        setMicUI(false);
        updateProgress(5, "5%");
        speakAI(currentOpening);
      } catch (e) {
        console.error(e);
        stopLoadCopyRotation();
        statusText.textContent = "モデル読み込み失敗";
        aiPromptText.textContent = "ページを再読み込みしてください";
      }
    }

    async function blobToFloat32(blob) {
      const ab = await blob.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const buf = await ctx.decodeAudioData(ab);
      let data = buf.getChannelData(0);
      if (buf.sampleRate !== 16000) {
        const offline = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
        const src = offline.createBufferSource();
        src.buffer = buf;
        src.connect(offline.destination);
        src.start();
        const rendered = await offline.startRendering();
        data = rendered.getChannelData(0);
      }
      return new Float32Array(data);
    }

    async function transcribe(float32) {
      const inputs = await processor(float32);
      const outputs = await model.generate({ ...inputs, max_new_tokens: 96 });
      return tokenizer.decode(outputs[0], { skip_special_tokens: true }).trim() || "（聞き取れませんでした）";
    }

    async function callLLM(messages) {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      return data.text || data.choices?.[0]?.message?.content || "";
    }

    async function getAcoustic(blob) {
      try {
        const fd = new FormData();
        fd.append("file", blob, "speech.webm");
        const res = await fetch(`${BACKEND_URL}/extract-features`, { method: "POST", body: fd });
        return res.ok ? await res.json() : {};
      } catch { return {}; }
    }

    /** 診断JSONを厳密にパース。失敗時はフォールバック */
    function parseDiagnosisJSON(raw, scores) {
      const fallbackTitle = titleFromScores(scores);
      const fallbackDetail = "今日の話をありがとう。無理せず、できる範囲で休んでみてください。";
      if (!raw) return { title: fallbackTitle, detail: fallbackDetail };

      // コードフェンス除去
      let s = raw.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
      // 最初の { ... } を抽出
      const m = s.match(/\{[\s\S]*\}/);
      if (m) s = m[0];
      try {
        const obj = JSON.parse(s);
        const title = (obj.title || obj.タイトル || "").toString().trim();
        const detail = (obj.detail || obj.詳細 || obj.body || "").toString().trim();
        return {
          title: title || fallbackTitle,
          detail: detail || fallbackDetail
        };
      } catch {
        // 行ベースの旧形式フォールバック
        const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
        const titleLine = lines.find(l => /タイトル/.test(l));
        const detailLines = lines.filter(l => !/タイトル/.test(l));
        return {
          title: titleLine ? titleLine.replace(/.*タイトル[：:\s]*/, "").trim() : fallbackTitle,
          detail: detailLines.join(" ").replace(/.*詳細[：:\s]*/, "").trim() || fallbackDetail
        };
      }
    }

    // =========================================================
    // 録音・波形
    // =========================================================
    function setMicUI(recording) {
      if (recording) {
        micInnerIcon.textContent = "stop";
        micInnerIcon.className = "material-icons stop-icon";
        micHint.textContent = "タップして停止";
        micBtn.classList.add("mic-pulse");
      } else {
        micInnerIcon.textContent = "mic";
        micInnerIcon.className = "material-icons mic-icon";
        micHint.textContent = "タップして話す";
        micBtn.classList.remove("mic-pulse");
      }
    }

    function updateWaveFromRms(rms) {
      // rms ~ 0.005〜0.12 を 1〜7 スケールに
      const level = Math.min(1, Math.max(0, (rms - 0.004) / 0.08));
      waveDots.forEach((dot, i) => {
        const center = (waveDots.length - 1) / 2;
        const dist = Math.abs(i - center) / center;
        const h = 6 + level * (22 - dist * 10);
        const op = 0.35 + level * 0.65;
        dot.style.transform = `scaleY(${h / 6})`;
        dot.style.opacity = String(op);
      });
    }

    function stopWaveAnim() {
      if (waveRaf) { cancelAnimationFrame(waveRaf); waveRaf = null; }
      waveDots.forEach(d => {
        d.style.transform = "scaleY(1)";
        d.style.opacity = "0.45";
      });
    }

    async function startRecording() {
      if (!isModelReady || isRecording || isSpeaking) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          stopWaveAnim();
          if (audioContext) { try { await audioContext.close(); } catch {} audioContext = null; }
          await processTurn();
        };

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);

        mediaRecorder.start(200);
        isRecording = true;
        silenceStart = null;
        waveContainer.classList.remove("hidden");
        statusText.textContent = "あなたのお話を聞いています...";
        setMicUI(true);
        loopMonitor();
      } catch (e) {
        console.error(e);
        statusText.textContent = "マイクの許可が必要です";
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      waveContainer.classList.add("hidden");
      statusText.textContent = "認識中...";
      setMicUI(false);
      mediaRecorder.stop();
    }

    function loopMonitor() {
      if (!isRecording || !analyser) return;
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      updateWaveFromRms(rms);

      if (rms < SILENCE_THRESHOLD) {
        if (!silenceStart) silenceStart = Date.now();
        else if (Date.now() - silenceStart > SILENCE_MS) {
          stopRecording();
          return;
        }
      } else {
        silenceStart = null;
      }
      waveRaf = requestAnimationFrame(loopMonitor);
    }

    function afterSpeakThenRecord() {
      setTimeout(() => {
        if (isModelReady && currentTurn < 2 && !viewResultBtn.classList.contains("hidden") === false) {
          // still scanning
        }
        if (isModelReady && currentTurn < 2) startRecording();
      }, POST_TTS_GAP_MS);
    }

    // =========================================================
    // ターン処理（3ターン）
    // =========================================================
    async function processTurn() {
      try {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        lastAudioBlob = blob;
        statusText.textContent = "文字起こし中...";
        const float32 = await blobToFloat32(blob);
        const userText = await transcribe(float32);
        console.log("認識:", userText);
        allUserTexts.push(userText);
        conversationLog.push({ role: "user", content: userText });
        const acousticP = getAcoustic(blob);
        currentTurn++;

        if (currentTurn === 1) {
          statusText.textContent = "AIが考えています...";
          updateProgress(35, "35%");
          const messages = [
            { role: "system", content: buildTurnSystem("followup", currentOpening) },
            ...conversationLog
          ];
          const reply = (await callLLM(messages)).trim() || "そうなんですね。もう少し詳しく教えてもらえますか？";
          conversationLog.push({ role: "assistant", content: reply });
          aiPromptText.innerHTML = reply.replace(/\n/g, "<br>");
          speakAI(reply, afterSpeakThenRecord);

        } else if (currentTurn === 2) {
          statusText.textContent = "AIが考えています...";
          updateProgress(65, "65%");
          const closeMessages = [
            { role: "system", content: buildTurnSystem("close", currentOpening) },
            ...conversationLog
          ];
          const summary = (await callLLM(closeMessages)).trim() || "話してくれてありがとう。";
          conversationLog.push({ role: "assistant", content: summary });
          aiPromptText.innerHTML = summary.replace(/\n/g, "<br>");

          lastAcoustic = await acousticP;
          statusText.textContent = "内容を分析中...";
          updateProgress(85, "85%");

          const joined = allUserTexts.join("。");
          const scores = await scoreWithFallback(joined, lastAcoustic, lastAudioBlob);
          const recovery = pickRecovery(scores);

          const diagnosisMessages = [
            {
              role: "system",
              content: `あなたは優しいアドバイザーです。発言と疲労スコアに一貫した短いアドバイスを出してください。
出力は必ず次のJSONのみ（前置き・後書き・コードフェンス禁止）:
{"title":"〇〇な疲れ","detail":"ユーザーに語りかける2〜3文。〜かもしれません／〜してみてください を使う"}
titleはスコアの一番高い軸と矛盾しないこと。`
            },
            {
              role: "user",
              content: `【疲労スコア】身体:${scores.physical} 脳:${scores.brain} 精神:${scores.mental} 総合ウェルビーイング:${scores.total}
【会話】
${conversationLog.map(m => (m.role === "user" ? "ユーザー" : "AI") + "：" + m.content).join("\n")}`
            }
          ];
          const diagnosisRaw = await callLLM(diagnosisMessages);
          const { title, detail } = parseDiagnosisJSON(diagnosisRaw, scores);

          document.getElementById("fatigueTitle").textContent = title;
          document.getElementById("fatigueDetailText").textContent = detail;
          applyScoreUI(scores);
          renderRecovery(recovery.suggestions);

          updateProgress(100, "100%");
          statusText.textContent = "スキャン完了";
          micBtn.classList.add("hidden");
          viewResultBtn.classList.remove("hidden");

          speakAI(summary + "。結果をご覧ください。");
        }
      } catch (e) {
        console.error(e);
        statusText.textContent = "エラーが発生しました。もう一度どうぞ";
        setMicUI(false);
        isRecording = false;
      }
    }

    // =========================================================
    // TTS（Edge・リトライ・ブラウザ標準なし）
    // =========================================================
    async function speakAI(text, onEnd, retries = 1) {
      if (!text || !String(text).trim()) {
        if (onEnd) onEnd();
        return;
      }
      isSpeaking = true;
      const prevStatus = statusText.textContent;
      statusText.textContent = "AIが話しています...";
      micBtn.disabled = true;
      micBtn.classList.add("opacity-50");

      try {
        const url = `${BACKEND_URL}/tts?text=${encodeURIComponent(text)}&voice=ja-JP-NanamiNeural`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("TTS failed: " + res.status);

        const blob = await res.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);

        const finish = () => {
          URL.revokeObjectURL(audioUrl);
          statusText.textContent = prevStatus;
          isSpeaking = false;
          if (isModelReady && viewResultBtn.classList.contains("hidden")) {
            micBtn.disabled = false;
            micBtn.classList.remove("opacity-50");
          }
          if (onEnd) onEnd();
        };
        audio.onended = finish;
        audio.onerror = finish;
        await audio.play();
      } catch (e) {
        console.warn("Edge TTS失敗", e);
        if (retries > 0) {
          statusText.textContent = "音声の準備中...";
          await new Promise(r => setTimeout(r, 1500));
          return speakAI(text, onEnd, retries - 1);
        }
        statusText.textContent = "音声を再生できませんでした";
        isSpeaking = false;
        if (isModelReady) {
          micBtn.disabled = false;
          micBtn.classList.remove("opacity-50");
        }
        if (onEnd) onEnd();
      }
    }

    // =========================================================
    // イベント
    // =========================================================
    micBtn.addEventListener("click", () => {
      if (!isModelReady || isSpeaking) return;
      if (isRecording) stopRecording();
      else startRecording();
    });

    viewResultBtn.addEventListener("click", () => {
      scanScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      resultScreen.classList.add("entering");
    });

    loadModel();
  </script>
