<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI ボイスチャット & 疲労度分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Transformers.js for Client-side Text Embeddings -->
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[90vh]">
    
    <!-- API Settings Header -->
    <div class="bg-slate-800 text-white p-4 text-xs space-y-2">
      <div class="flex justify-between items-center font-bold text-sm">
        <span>⚙️ 設定</span>
      </div>
      <div>
        <label class="block mb-1">Render Backend URL:</label>
        <input id="backendUrl" type="text" placeholder="https://xxx.onrender.com" class="w-full p-1.5 rounded text-black font-mono">
      </div>
      <div>
        <label class="block mb-1">Groq API Key:</label>
        <input id="groqApiKey" type="password" placeholder="gsk_..." class="w-full p-1.5 rounded text-black font-mono">
      </div>
    </div>

    <!-- Chat Display Area -->
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
      <div class="bg-blue-100 text-blue-900 p-3 rounded-xl max-w-[85%] text-sm">
        こんにちは！声を聞かせてください。「今日は体が重いです」など気軽にお話ししましょう。
      </div>
    </div>

    <!-- Status & Recording Control -->
    <div class="p-4 bg-white border-t flex flex-col items-center space-y-3">
      <p id="statusText" class="text-xs text-slate-500 font-medium">マイクボタンを押して発話してください</p>
      
      <button id="recordBtn" class="w-16 h-16 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg transition-transform active:scale-95">
        <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
        </svg>
      </button>
    </div>

    <!-- Fatigue Report Display Section (Whiteboard Design) -->
    <div class="bg-indigo-900 text-white p-4 border-t border-indigo-800">
      <h3 class="text-sm font-bold border-b border-indigo-700 pb-1 mb-2">📊 あなたの疲労レポート</h3>
      
      <div class="grid grid-cols-3 gap-2 text-center text-xs mb-3">
        <div class="bg-indigo-800/60 p-2 rounded">
          <div class="text-slate-300">身体</div>
          <div id="scorePhysical" class="text-lg font-bold text-amber-400">--%</div>
        </div>
        <div class="bg-indigo-800/60 p-2 rounded">
          <div class="text-slate-300">脳</div>
          <div id="scoreBrain" class="text-lg font-bold text-cyan-400">--%</div>
        </div>
        <div class="bg-indigo-800/60 p-2 rounded">
          <div class="text-slate-300">精神</div>
          <div id="scoreMental" class="text-lg font-bold text-emerald-400">--%</div>
        </div>
      </div>

      <div class="flex justify-between items-center text-sm font-bold bg-indigo-950 p-2 rounded mb-2">
        <span>トータル疲労度:</span>
        <span id="scoreTotal" class="text-amber-300 text-base">-- 点</span>
      </div>

      <div class="text-xs">
        <span class="font-semibold text-indigo-300">💡 おすすめ体操/アドバイス:</span>
        <p id="adviceText" class="mt-1 text-slate-200 leading-relaxed">音声データ入力後に自動生成されます。</p>
      </div>
    </div>

  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let embedder = null;

    // Xenova/transformers (クライアント側でテキスト埋め込み計算)
    async function initEmbedder() {
      if (!embedder && window.xenova) {
        embedder = await window.xenova.transformers.pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
      }
    }
    initEmbedder();

    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('statusText');
    const chatBox = document.getElementById('chatBox');

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    async function startRecording() {
      const backendUrl = document.getElementById('backendUrl').value.trim();
      const groqKey = document.getElementById('groqApiKey').value.trim();

      if (!backendUrl || !groqKey) {
        alert("Render URL と Groq API Key を入力してください。");
        return;
      }

      audioChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      
      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      mediaRecorder.onstop = processAudioPipeline;

      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.replace('bg-red-500', 'bg-slate-700');
      statusText.innerText = "あなたの声を聞いています...";
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.replace('bg-slate-700', 'bg-red-500');
      statusText.innerText = "処理中...";
    }

    async function processAudioPipeline() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
      const groqKey = document.getElementById('groqApiKey').value.trim();
      const backendUrl = document.getElementById('backendUrl').value.trim();

      try {
        // 1. Groq Whisper (フロントエンド -> Groq API で文字起こし)
        statusText.innerText = "文字起こし中...";
        const transcribedText = await callGroqWhisper(audioBlob, groqKey);
        appendMessage('user', transcribedText);

        // 2. OpenSmile 特徴量抽出 (フロントエンド -> Render FastAPI)
        statusText.innerText = "音響特徴量抽出中(OpenSmile)...";
        const acousticFeatures = await extractOpenSmileFeatures(audioBlob, backendUrl);

        // 3. テキスト特徴量 & 埋め込みベクトルの計算 (フロントエンド)
        statusText.innerText = "疲労度スコア分析中...";
        const textFeatures = await computeTextFeatures(transcribedText);

        // 特徴量の統合
        const fullFeatures = { ...acousticFeatures, ...textFeatures };

        // 4. LightGBM 推論 (フロントエンドのJSで推論を実行)
        const fatigueScores = predictLightGBM(fullFeatures);
        updateScoreUI(fatigueScores);

        // 5. Groq Llama 3 チャット & レポート・アドバイス生成
        statusText.innerText = "AI応答生成中...";
        const aiResponse = await callGroqLlama(transcribedText, fatigueScores, groqKey);
        appendMessage('ai', aiResponse.reply);
        document.getElementById('adviceText').innerText = aiResponse.exerciseAdvice;

        statusText.innerText = "マイクボタンを押して発話してください";
      } catch (err) {
        console.error(err);
        statusText.innerText = "エラーが発生しました: " + err.message;
      }
    }

    // --- Groq Whisper API Call ---
    async function callGroqWhisper(blob, apiKey) {
      const formData = new FormData();
      formData.append('file', blob, 'speech.wav');
      formData.append('model', 'whisper-large-v3-turbo');
      formData.append('language', 'ja');

      const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}` },
        body: formData
      });
      const data = await res.json();
      return data.text || "（音声が聞き取れませんでした）";
    }

    // --- Render OpenSmile API Call ---
    async function extractOpenSmileFeatures(blob, backendUrl) {
      const formData = new FormData();
      formData.append('file', blob, 'speech.wav');

      const res = await fetch(`${backendUrl.replace(/\/$/, '')}/extract-features`, {
        method: 'POST',
        body: formData
      });
      return await res.json();
    }

    // --- Frontend Text Feature Extraction ---
    async function computeTextFeatures(text) {
      const features = {
        text_length: text.length,
        word_count: text.split(/\s+/).length,
        unique_chars: new Set(text).size,
        lexical_diversity: (new Set(text).size) / (text.length || 1),
        fatigue_word_count: (text.match(/(疲れた|重い|しんどい|眠い|だるい|痛い)/g) || []).length
      };

      // 384次元のテキスト埋め込み計算 (emb_0 〜 emb_383)
      if (embedder) {
        const output = await embedder(text, { pooling: 'mean', normalize: true });
        const embArr = Array.from(output.data);
        for (let i = 0; i < 384; i++) {
          features[`emb_${i}`] = embArr[i] || 0.0;
        }
      } else {
        for (let i = 0; i < 384; i++) features[`emb_${i}`] = 0.0;
      }

      return features;
    }

    // --- Frontend LightGBM Tree Evaluation (Simple Decision Tree Inference) ---
    function predictLightGBM(features) {
      // モデル木（LightGBMで学習したLeaf/Tree構造）の推論ロジック
      // ここでは簡略化されたツリー計算またはスコアリングロジックを実行
      
      const loudness = features['smile_loudness_sma3_amean'] || 0;
      const f0 = features['smile_F0semitoneFrom27.5Hz_sma3nz_amean'] || 0;
      const fatigueWords = features['fatigue_word_count'] || 0;

      // 各指標のサンプル簡易計算 (学習モデルのツリー走査ロジックをここに配置)
      let physical = Math.min(100, Math.max(10, Math.round(50 + (fatigueWords * 15) - (loudness * 10))));
      let brain = Math.min(100, Math.max(10, Math.round(45 + (features.text_length > 30 ? 20 : 0))));
      let mental = Math.min(100, Math.max(10, Math.round(50 + (f0 < 20 ? 20 : -10))));
      let total = Math.round((physical + brain + mental) / 3);

      return { physical, brain, mental, total };
    }

    // --- UI Updaters ---
    function updateScoreUI(scores) {
      document.getElementById('scorePhysical').innerText = `${scores.physical}%`;
      document.getElementById('scoreBrain').innerText = `${scores.brain}%`;
      document.getElementById('scoreMental').innerText = `${scores.mental}%`;
      document.getElementById('scoreTotal').innerText = `${scores.total} 点`;
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = sender === 'user'
        ? 'bg-indigo-600 text-white p-3 rounded-xl max-w-[85%] ml-auto text-sm'
        : 'bg-slate-200 text-slate-800 p-3 rounded-xl max-w-[85%] text-sm';
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- Groq Llama 3 LLM Call ---
    async function callGroqLlama(userSpeech, scores, apiKey) {
      const prompt = `
ユーザー発話: "${userSpeech}"
疲労分析結果: 身体疲労=${scores.physical}%, 脳疲労=${scores.brain}%, 精神疲労=${scores.mental}%, トータルスコア=${scores.total}点

以下のJSON形式のみで回答してください：
{
  "reply": "ユーザーへの共感的で短めの返し（2〜3文）",
  "exerciseAdvice": "疲労状態に応じたおすすめの簡単なストレッチや体操（1〜2文）"
}`;

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: [{ role: 'user', content: prompt }],
          response_format: { type: 'json_object' }
        })
      });

      const data = await res.json();
      try {
        return JSON.parse(data.choices[0].message.content);
      } catch (e) {
        return {
          reply: data.choices[0].message.content,
          exerciseAdvice: "軽く深呼吸をして肩をまわしましょう。"
        };
      }
    }
  </script>
</body>
</html>
