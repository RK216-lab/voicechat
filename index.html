<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自分スキャン - AI疲労診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif; }
    .bg-app-gradient {
      background: linear-gradient(165deg, #FDE8E1 0%, #FDF3EE 45%, #E8EEFB 100%);
    }
    .wave-dot {
      width: 7px; height: 7px; border-radius: 9999px; background: #34D399;
      animation: bounce 1.15s infinite ease-in-out;
    }
    .wave-dot:nth-child(2) { animation-delay: 0.12s; }
    .wave-dot:nth-child(3) { animation-delay: 0.24s; }
    .wave-dot:nth-child(4) { animation-delay: 0.36s; }
    .wave-dot:nth-child(5) { animation-delay: 0.48s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50% { transform: translateY(-7px); opacity: 1; }
    }
    .material-icons { font-size: 22px; vertical-align: middle; }
    .mic-icon { font-size: 32px !important; color: #ef4444; }
    .stop-icon { font-size: 28px !important; color: #ef4444; }
    .fade-in { animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-200 flex justify-center items-center min-h-screen">

  <div class="w-full max-w-md h-[844px] bg-app-gradient shadow-2xl rounded-[40px] overflow-hidden flex flex-col relative border-4 border-white/40">

    <div id="scanScreen" class="flex-1 flex flex-col p-5 relative">
      <div class="pt-1">
        <div class="flex items-center justify-between mb-3">
          <button class="w-9 h-9 rounded-full bg-white/70 flex items-center justify-center text-slate-500 shadow-sm">
            <span class="material-icons" style="font-size:20px">chevron_left</span>
          </button>
          <h1 class="text-slate-700 font-bold text-sm tracking-wide">自分スキャン</h1>
          <div class="w-9"></div>
        </div>
        <div class="space-y-1.5 px-1">
          <div class="flex justify-between text-[11px] text-slate-500 font-medium">
            <span>スキャン進行度</span>
            <span id="progressText">0%</span>
          </div>
          <div class="w-full bg-white/60 rounded-full h-2 overflow-hidden border border-white/70">
            <div id="progressBar" class="bg-emerald-400 h-full rounded-full transition-all duration-500" style="width:0%"></div>
          </div>
        </div>
      </div>

      <div class="flex-1 flex flex-col justify-center items-center text-center px-3 space-y-5">
        <div id="statusBadge" class="inline-flex items-center gap-2 bg-white/85 backdrop-blur px-4 py-1.5 rounded-full text-xs text-slate-600 shadow-sm">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="statusText">モデルを準備中...</span>
        </div>
        <h2 id="aiPromptText" class="text-[18px] font-bold text-slate-800 leading-relaxed max-w-[290px] min-h-[3.2em]">
          準備ができたら<br>下のボタンを押してください
        </h2>
        <div id="waveContainer" class="flex items-center gap-1.5 h-5 hidden">
          <div class="wave-dot"></div><div class="wave-dot"></div>
          <div class="wave-dot"></div><div class="wave-dot"></div>
          <div class="wave-dot"></div>
        </div>
      </div>

      <div class="flex flex-col items-center pb-3 space-y-3">
        <button id="micBtn" disabled
          class="w-[78px] h-[78px] rounded-full bg-white border-[5px] border-red-400 flex items-center justify-center shadow-lg transition-all active:scale-95 opacity-50">
          <span id="micInnerIcon" class="material-icons mic-icon">mic</span>
        </button>
        <p id="micHint" class="text-xs text-slate-400">モデル読み込み中...</p>
        <button id="viewResultBtn" class="hidden w-full py-3.5 bg-orange-400 hover:bg-orange-500 text-white font-bold rounded-2xl shadow-md fade-in">
          スキャン完了！結果を見る
        </button>
      </div>
    </div>

    <div id="resultScreen" class="hidden flex-1 flex flex-col p-5 overflow-y-auto space-y-4 bg-[#FDF3EE]">
      <div class="text-center pt-1">
        <h2 class="text-slate-700 font-bold text-base">診断結果</h2>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-sm border border-orange-100/60 text-center space-y-1.5 fade-in">
        <p class="text-[10px] font-bold text-slate-400 tracking-widest">TODAY'S WELL-BEING</p>
        <div class="flex justify-center items-baseline gap-0.5">
          <span id="scoreTotalVal" class="text-5xl font-black text-emerald-500">--</span>
          <span class="text-base font-bold text-slate-400">/100</span>
        </div>
      </div>

      <div class="space-y-2">
        <h3 class="text-[11px] font-bold text-slate-600 px-1">コンディション解析</h3>
        <div class="grid grid-cols-3 gap-2.5">
          <div class="bg-white rounded-2xl p-3 shadow-sm text-center border border-slate-100">
            <div id="scoreBrainVal" class="text-xl font-black text-slate-700">--<span class="text-xs font-normal">%</span></div>
            <div class="text-[10px] text-slate-400 font-medium mt-0.5">脳</div>
          </div>
          <div class="bg-white rounded-2xl p-3 shadow-sm text-center border border-slate-100">
            <div id="scoreMentalVal" class="text-xl font-black text-slate-700">--<span class="text-xs font-normal">%</span></div>
            <div class="text-[10px] text-slate-400 font-medium mt-0.5">精神</div>
          </div>
          <div class="bg-white rounded-2xl p-3 shadow-sm text-center border border-slate-100">
            <div id="scorePhysicalVal" class="text-xl font-black text-orange-500">--<span class="text-xs font-normal">%</span></div>
            <div class="text-[10px] text-slate-400 font-medium mt-0.5">身体</div>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-3xl p-4 shadow-sm border border-orange-100 space-y-2.5 fade-in">
        <div class="flex items-center gap-1.5 text-[11px] font-bold text-orange-500">
          <span class="material-icons" style="font-size:16px;color:#f97316">warning</span>
          <span>分析結果</span>
        </div>
        <div class="bg-orange-50/70 rounded-2xl p-3 border border-orange-100 text-center">
          <p class="text-[10px] text-orange-400 font-medium">一言で表すと、今のあなたは…</p>
          <p id="fatigueTitle" class="text-sm font-bold text-orange-600 mt-0.5">分析中...</p>
        </div>
        <p id="fatigueDetailText" class="text-xs text-slate-500 leading-relaxed"></p>
      </div>

      <div class="space-y-2">
        <h3 class="text-[11px] font-bold text-slate-600 px-1">リカバリープログラム</h3>
        <div id="recoveryList" class="space-y-2"></div>
      </div>

      <button onclick="location.reload()" class="w-full py-3.5 bg-slate-800 text-white text-xs font-bold rounded-2xl shadow-md mt-1">
        ホームに戻る
      </button>
    </div>

    <div class="bg-white/85 backdrop-blur border-t border-slate-100 py-2.5 px-4 flex justify-between items-center text-slate-400">
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">home</span><span>ホーム</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">menu_book</span><span>知る</span>
      </div>
      <div class="flex flex-col items-center text-[10px] text-orange-400 font-bold space-y-0.5">
        <span class="material-icons" style="font-size:20px;color:#fb923c">waves</span><span>スキャン</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">favorite_border</span><span>ケア</span>
      </div>
      <div class="flex flex-col items-center text-[10px] space-y-0.5">
        <span class="material-icons" style="font-size:20px">person_outline</span><span>私</span>
      </div>
    </div>
  </div>

  <script type="module">
    const BACKEND_URL = "https://voicechat-gz4j.onrender.com";
    const MODEL_ID = "wmoto-ai/moonshine-tiny-ja-ONNX";
    const EMBED_MODEL = "Xenova/paraphrase-multilingual-MiniLM-L12-v2";

    let model = null, processor = null, tokenizer = null;
    let extractor = null;
    let defVectors = null;
    let isModelReady = false;
    let isEmbedReady = false;
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let silenceStart = null;
    let currentTurn = 0;
    let allUserTexts = [];
    let conversationLog = [];
    let lastAcoustic = {};
    let isSpeaking = false;
    let currentOpening = "";

    const SILENCE_THRESHOLD = 0.013;
    const SILENCE_MS = 1600;

    // 最初の質問：何を話せばよいか分かる具体例付き・多様
    const OPENINGS = [
      "こんにちは。今日いちばん体に感じていることをひとこと教えてください。たとえば「肩がこってる」や「眠い」でも大丈夫です。",
      "お疲れさまです。朝から今までで、ちょっとしんどいなと思った場面はありましたか？",
      "こんにちは。今の気分を天気に例えるなら、晴れ・くもり・雨のどれに近いですか？",
      "少しだけお話ししてもいいですか。最近、集中が途切れやすいことや、体が重いことはありますか？",
      "こんにちは。仕事や勉強のあと、体と頭、どちらが先に疲れやすいですか？",
      "今日の自分を0から10で表すなら、何点くらいの調子ですか？ ざっくりで大丈夫です。",
      "お疲れさまです。昨夜の睡眠や今朝の目覚めは、いつもの自分と比べてどうでしたか？",
      "こんにちは。いま一番ほしいものは、休み・食事・誰かとの話・何もしない時間、どれに近いですか？"
    ];

    const SYSTEM_BASE = `あなたは疲労スキャンのための優しい聞き手です。
ルール：
- 必ず日本語。1〜2文、全体で50文字以内。
- 質問は1つだけ。説明や箇条書きは禁止。
- 診断名・スコア・医学的断定は言わない。
- ユーザーが短く答えても責めない。`;

    function buildTurnSystem(turnIndex, openingText) {
      if (turnIndex === 0) {
        return `${SYSTEM_BASE}
今は2回目のあなたの発話です。最初にあなたはこう聞きました：「${openingText}」
ユーザーの答えに短い共感を入れてから、最初の質問と違う角度だけ深掘りしてください。
禁止：最初と同じ「調子どう？」「どうでしたか？」系の聞き直し。
良い例：体の話なら「それはいつ頃から？」、気分なら「それが続くとどんな感じ？」、数字なら「その点数になった一番の理由は？」
悪い例：今日の調子はどうですか？`;
      }
      return `${SYSTEM_BASE}
最後の発話です。これまでの内容を1文で受け止め、「話してくれてありがとう」と伝えて終えてください。
新しい質問は禁止。診断結果やスコアには触れない。40文字以内。`;
    }

    // 多プロトタイプ定義（論文の multi-exemplar / prototype matching）
    const FATIGUE_DEFS = {
      body: [
        "体が重い、だるい、肩や首や腰が張って動くのがつらい",
        "朝起きたときに体が軽く感じられない、体力が落ちたように思う",
        "いつもより動くことが負担に感じる、立ち仕事や歩行で疲れやすい",
        "筋肉の張りや違和感がある、体のどこかがこわばっている",
        "眠いというより体が鉛のようで、横になりたい気持ちが強い"
      ],
      brain: [
        "頭がぼんやりして集中できない、ミスが増えたように感じる",
        "情報を整理したり思い出す作業が難しく感じる",
        "考えがまとまらない、判断にいつもより時間がかかる",
        "画面を見続けると頭がすぐ疲れる、注意が途切れやすい",
        "言葉が出にくい、話の要点をつかむのが大変に感じる"
      ],
      mental: [
        "気持ちが休まらない、イライラや気分の落ち込みがある",
        "プレッシャーを感じて心が疲れている、気分が揺れやすい",
        "不安が続きリラックスできない、気持ちの切り替えが難しい",
        "やる気が出ない、何をするにも気が重い",
        "人と話すのが少し負担に感じる、一人になりたい気持ちがある"
      ],
      healthy: [
        "特に疲れはなく調子がよい、体も頭も軽く感じる",
        "集中できて気分も安定している、いつも通り元気だ",
        "睡眠も食欲も問題なく、無理なく一日を過ごせている",
        "ストレスはあるがコントロールできていて、休息も取れている"
      ]
    };

    const RECOVERY = {
      body: [
        { icon: "self_improvement", color: "#ea580c", bg: "bg-orange-100", title: "軽いストレッチ", desc: "座ったまま肩・首をゆっくり回す（3分）" },
        { icon: "hot_tub", color: "#0284c7", bg: "bg-sky-100", title: "温活", desc: "ぬるめのお湯で体の芯を温める" },
        { icon: "hotel", color: "#7c3aed", bg: "bg-violet-100", title: "短い仮眠", desc: "15〜20分の昼寝で体を休める" }
      ],
      brain: [
        { icon: "visibility", color: "#0891b2", bg: "bg-cyan-100", title: "画面から離れる", desc: "5〜10分、遠くを見て目と頭を休める" },
        { icon: "directions_walk", color: "#16a34a", bg: "bg-green-100", title: "短い散歩", desc: "外の空気を吸って頭を切り替える" },
        { icon: "schedule", color: "#ca8a04", bg: "bg-yellow-100", title: "判断を後回し", desc: "難しい判断は後で、簡単な作業だけにする" }
      ],
      mental: [
        { icon: "air", color: "#2563eb", bg: "bg-blue-100", title: "深呼吸", desc: "4秒吸って6秒吐く呼吸を5回" },
        { icon: "edit_note", color: "#db2777", bg: "bg-pink-100", title: "気持ちの書き出し", desc: "今気になっていることをメモに出すだけ" },
        { icon: "music_note", color: "#9333ea", bg: "bg-purple-100", title: "好きな休息", desc: "何もしない時間を10分つくる" }
      ],
      general: [
        { icon: "local_drink", color: "#0d9488", bg: "bg-teal-100", title: "水分補給", desc: "常温の水をゆっくり飲む" },
        { icon: "bedtime", color: "#4f46e5", bg: "bg-indigo-100", title: "早めの就寝準備", desc: "いつもより30分早く寝る準備を始める" }
      ]
    };

    const statusText    = document.getElementById("statusText");
    const aiPromptText  = document.getElementById("aiPromptText");
    const progressBar   = document.getElementById("progressBar");
    const progressText  = document.getElementById("progressText");
    const micBtn        = document.getElementById("micBtn");
    const micHint       = document.getElementById("micHint");
    const micInnerIcon  = document.getElementById("micInnerIcon");
    const waveContainer = document.getElementById("waveContainer");
    const viewResultBtn = document.getElementById("viewResultBtn");
    const recoveryList  = document.getElementById("recoveryList");

    function setMicUI(recording) {
      if (recording) {
        micInnerIcon.textContent = "stop";
        micInnerIcon.className = "material-icons stop-icon";
        micHint.textContent = "タップして停止";
      } else {
        micInnerIcon.textContent = "mic";
        micInnerIcon.className = "material-icons mic-icon";
        micHint.textContent = "タップして話す";
      }
    }

    async function loadEmbedder() {
      try {
        statusText.textContent = "分析モデル読み込み中...";
        const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0");
        extractor = await pipeline("feature-extraction", EMBED_MODEL, {
          dtype: "q8",
          device: "wasm"
        });
        defVectors = {};
        for (const [key, texts] of Object.entries(FATIGUE_DEFS)) {
          const vecs = [];
          for (const t of texts) {
            const out = await extractor(t, { pooling: "mean", normalize: true });
            vecs.push(Array.from(out.data));
          }
          defVectors[key] = vecs;
        }
        isEmbedReady = true;
        console.log("埋め込み準備完了");
      } catch (e) {
        console.warn("埋め込み読み込み失敗", e);
        isEmbedReady = false;
      }
    }

    function cosine(a, b) {
      let s = 0;
      const n = Math.min(a.length, b.length);
      for (let i = 0; i < n; i++) s += a[i] * b[i];
      return s;
    }

    // max + mean ハイブリッド（multi-prototype matching）
    function simToCategory(userVec, prototypes) {
      const sims = prototypes.map(p => cosine(userVec, p));
      const maxS = Math.max(...sims);
      const meanS = sims.reduce((a, b) => a + b, 0) / sims.length;
      return 0.7 * maxS + 0.3 * meanS;
    }

    async function scoreFromText(userText) {
      if (!isEmbedReady || !extractor || !defVectors) {
        return heuristicTextScores(userText);
      }
      try {
        const out = await extractor(userText || "特になし", { pooling: "mean", normalize: true });
        const v = Array.from(out.data);
        const raw = {
          body: simToCategory(v, defVectors.body),
          brain: simToCategory(v, defVectors.brain),
          mental: simToCategory(v, defVectors.mental),
          healthy: simToCategory(v, defVectors.healthy)
        };
        // healthy とのコントラスト（相対化）
        const toPct = (c) => Math.max(15, Math.min(92, Math.round(48 + c * 160)));
        const physical = toPct(raw.body - raw.healthy);
        const brain = toPct(raw.brain - raw.healthy);
        const mental = toPct(raw.mental - raw.healthy);
        const avgFatigue = (physical + brain + mental) / 3;
        const total = Math.max(18, Math.min(95, Math.round(100 - avgFatigue * 0.88)));
        return { physical, brain, mental, total, raw };
      } catch (e) {
        console.warn("埋め込みスコア失敗", e);
        return heuristicTextScores(userText);
      }
    }

    function heuristicTextScores(text) {
      const t = text || "";
      let physical = 42, brain = 42, mental = 42;
      if (/だる|重い|肩こり|腰痛|眠い|体力|こわば|張[りっ]/.test(t)) physical += 22;
      if (/集中|ぼんやり|ミス|頭|忘れ|整理|判断/.test(t)) brain += 22;
      if (/イライラ|落ち[込こ]|不安|ストレス|つらい|気[がも]重|やる気/.test(t)) mental += 20;
      if (/元気|調子いい|大丈夫|問題ない|すっきり|快調/.test(t)) {
        physical -= 18; brain -= 18; mental -= 18;
      }
      physical = Math.max(18, Math.min(90, physical));
      brain = Math.max(18, Math.min(90, brain));
      mental = Math.max(18, Math.min(90, mental));
      const total = Math.round(100 - (physical + brain + mental) / 3 * 0.88);
      return { physical, brain, mental, total: Math.max(22, Math.min(92, total)) };
    }

    function pickRecovery(scores) {
      const entries = [
        ["body", scores.physical],
        ["brain", scores.brain],
        ["mental", scores.mental]
      ].sort((a, b) => b[1] - a[1]);
      const list = [];
      const [topKey] = entries[0];
      const [secKey, secVal] = entries[1];
      list.push(...RECOVERY[topKey].slice(0, 2));
      if (secVal >= 55) list.push(RECOVERY[secKey][0]);
      const avg = (scores.physical + scores.brain + scores.mental) / 3;
      list.push(avg >= 60 ? RECOVERY.general[1] : RECOVERY.general[0]);
      const seen = new Set();
      const unique = [];
      for (const item of list) {
        if (!seen.has(item.title)) { seen.add(item.title); unique.push(item); }
      }
      return { suggestions: unique.slice(0, 4) };
    }

    function renderRecovery(suggestions) {
      recoveryList.innerHTML = suggestions.map(s => `
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex items-center gap-3 fade-in">
          <div class="w-12 h-12 rounded-xl ${s.bg} flex items-center justify-center">
            <span class="material-icons" style="color:${s.color}">${s.icon}</span>
          </div>
          <div>
            <p class="text-xs font-bold text-slate-700">${s.title}</p>
            <p class="text-[11px] text-slate-400">${s.desc}</p>
          </div>
        </div>
      `).join("");
    }

    function titleFromScores(scores) {
      const entries = [
        ["身体", scores.physical],
        ["脳", scores.brain],
        ["精神", scores.mental]
      ].sort((a, b) => b[1] - a[1]);
      const [name, val] = entries[0];
      if (val >= 70) return `${name}の強い疲れ`;
      if (val >= 55) return `${name}寄りの疲れ`;
      if (scores.total >= 70) return "比較的すっきりした状態";
      return "総合的な疲れ";
    }

    async function loadModel() {
      try {
        statusText.textContent = "音声認識モデル読み込み中...";
        const { MoonshineForConditionalGeneration, AutoProcessor, AutoTokenizer, env } =
          await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.0");
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        const embedP = loadEmbedder();
        [model, processor, tokenizer] = await Promise.all([
          MoonshineForConditionalGeneration.from_pretrained(MODEL_ID, { dtype: "fp32", device: "wasm" }),
          AutoProcessor.from_pretrained(MODEL_ID),
          AutoTokenizer.from_pretrained(MODEL_ID),
        ]);
        await embedP;
        isModelReady = true;
        statusText.textContent = "準備完了";
        currentOpening = OPENINGS[Math.floor(Math.random() * OPENINGS.length)];
        aiPromptText.innerHTML = currentOpening.replace(/。/g, "。<br>");
        conversationLog = [{ role: "assistant", content: currentOpening }];
        micBtn.disabled = false;
        micBtn.classList.remove("opacity-50");
        setMicUI(false);
        updateProgress(5, "5%");
        speakAI(currentOpening);
      } catch (e) {
        console.error(e);
        statusText.textContent = "モデル読み込み失敗";
        aiPromptText.textContent = "ページを再読み込みしてください";
      }
    }

    async function blobToFloat32(blob) {
      const ab = await blob.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const buf = await ctx.decodeAudioData(ab);
      let data = buf.getChannelData(0);
      if (buf.sampleRate !== 16000) {
        const offline = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
        const src = offline.createBufferSource();
        src.buffer = buf;
        src.connect(offline.destination);
        src.start();
        const rendered = await offline.startRendering();
        data = rendered.getChannelData(0);
      }
      return new Float32Array(data);
    }

    async function transcribe(float32) {
      const inputs = await processor(float32);
      const outputs = await model.generate({ ...inputs, max_new_tokens: 96 });
      return tokenizer.decode(outputs[0], { skip_special_tokens: true }).trim() || "（聞き取れませんでした）";
    }

    async function callLLM(messages) {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      return data.text || data.choices?.[0]?.message?.content || "応答を取得できませんでした";
    }

    async function getAcoustic(blob) {
      try {
        const fd = new FormData();
        fd.append("file", blob, "speech.webm");
        const res = await fetch(`${BACKEND_URL}/extract-features`, { method: "POST", body: fd });
        return res.ok ? await res.json() : {};
      } catch { return {}; }
    }

    async function startRecording() {
      if (!isModelReady || isRecording || isSpeaking) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          if (audioContext) { try { audioContext.close(); } catch {} audioContext = null; }
          await processTurn();
        };
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        mediaRecorder.start(200);
        isRecording = true;
        silenceStart = null;
        waveContainer.classList.remove("hidden");
        statusText.textContent = "あなたのお話を聞いています...";
        setMicUI(true);
        detectSilence();
      } catch (e) {
        console.error(e);
        statusText.textContent = "マイクの許可が必要です";
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      waveContainer.classList.add("hidden");
      statusText.textContent = "認識中...";
      setMicUI(false);
      mediaRecorder.stop();
    }

    function detectSilence() {
      if (!isRecording || !analyser) return;
      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      if (rms < SILENCE_THRESHOLD) {
        if (!silenceStart) silenceStart = Date.now();
        else if (Date.now() - silenceStart > SILENCE_MS) {
          stopRecording();
          return;
        }
      } else silenceStart = null;
      requestAnimationFrame(detectSilence);
    }

    // 3ターン: Opening → ユーザー1 → 深掘り → ユーザー2 → 締め+診断
    async function processTurn() {
      try {
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        statusText.textContent = "文字起こし中...";
        const float32 = await blobToFloat32(blob);
        const userText = await transcribe(float32);
        console.log("認識:", userText);
        allUserTexts.push(userText);
        conversationLog.push({ role: "user", content: userText });
        const acousticP = getAcoustic(blob);
        currentTurn++;

        if (currentTurn === 1) {
          statusText.textContent = "AIが考えています...";
          updateProgress(35, "35%");
          const messages = [
            { role: "system", content: buildTurnSystem(0, currentOpening) },
            ...conversationLog
          ];
          const reply = await callLLM(messages);
          conversationLog.push({ role: "assistant", content: reply });
          aiPromptText.innerHTML = reply.replace(/\n/g, "<br>");
          speakAI(reply, () => { setTimeout(() => startRecording(), 450); });

        } else if (currentTurn === 2) {
          statusText.textContent = "AIが考えています...";
          updateProgress(65, "65%");
          const closeMessages = [
            { role: "system", content: buildTurnSystem(1, currentOpening) },
            ...conversationLog
          ];
          const summary = await callLLM(closeMessages);
          conversationLog.push({ role: "assistant", content: summary });
          aiPromptText.innerHTML = summary.replace(/\n/g, "<br>");

          lastAcoustic = await acousticP;
          statusText.textContent = "内容を分析中...";
          updateProgress(85, "85%");
          const joined = allUserTexts.join("。");
          const scores = await scoreFromText(joined);
          const recovery = pickRecovery(scores);

          const diagnosisMessages = [
            {
              role: "system",
              content: `あなたは優しいアドバイザーです。発言と疲労スコアを参考に短いアドバイスを書いてください。
必ず次の形式だけ（前置き禁止）：
タイトル：〇〇な疲れ
詳細：ユーザーに語りかける2〜3文。「〜かもしれません」「〜してみてください」を使う。`
            },
            {
              role: "user",
              content: `【疲労スコア】身体:${scores.physical} 脳:${scores.brain} 精神:${scores.mental}
【会話】
${conversationLog.map(m => (m.role === "user" ? "ユーザー" : "AI") + "：" + m.content).join("\n")}`
            }
          ];
          const diagnosis = await callLLM(diagnosisMessages);
          const lines = diagnosis.split("\n").filter(l => l.trim());
          const titleLine = lines.find(l => l.includes("タイトル"));
          const detail = lines.filter(l => !l.includes("タイトル")).join(" ").replace(/詳細[：:]/, "").trim();

          document.getElementById("fatigueTitle").textContent =
            titleLine ? titleLine.replace(/タイトル[：:]/, "").trim() : titleFromScores(scores);
          document.getElementById("fatigueDetailText").textContent =
            detail || diagnosis || "今日の話をありがとう。無理せず、できる範囲で休んでみてください。";
          document.getElementById("scoreTotalVal").textContent = scores.total;
          document.getElementById("scoreBrainVal").innerHTML = `${scores.brain}<span class="text-xs font-normal">%</span>`;
          document.getElementById("scoreMentalVal").innerHTML = `${scores.mental}<span class="text-xs font-normal">%</span>`;
          document.getElementById("scorePhysicalVal").innerHTML = `${scores.physical}<span class="text-xs font-normal">%</span>`;
          renderRecovery(recovery.suggestions);

          updateProgress(100, "100%");
          statusText.textContent = "スキャン完了";
          micBtn.classList.add("hidden");
          viewResultBtn.classList.remove("hidden");
          speakAI(summary + "。結果をご覧ください。");
        }
      } catch (e) {
        console.error(e);
        statusText.textContent = "エラーが発生しました。もう一度どうぞ";
        setMicUI(false);
        isRecording = false;
      }
    }

    async function speakAI(text, onEnd, retries = 1) {
      if (!text || !text.trim()) { if (onEnd) onEnd(); return; }
      isSpeaking = true;
      const prevStatus = statusText.textContent;
      statusText.textContent = "AIが話しています...";
      micBtn.disabled = true;
      micBtn.classList.add("opacity-50");
      try {
        const url = `${BACKEND_URL}/tts?text=${encodeURIComponent(text)}&voice=ja-JP-NanamiNeural`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("TTS failed: " + res.status);
        const blob = await res.blob();
        const audioUrl = URL.createObjectURL(blob);
        const audio = new Audio(audioUrl);
        const finish = () => {
          URL.revokeObjectURL(audioUrl);
          statusText.textContent = prevStatus;
          isSpeaking = false;
          if (isModelReady) {
            micBtn.disabled = false;
            micBtn.classList.remove("opacity-50");
          }
          if (onEnd) onEnd();
        };
        audio.onended = finish;
        audio.onerror = finish;
        await audio.play();
      } catch (e) {
        console.warn("Edge TTS失敗", e);
        if (retries > 0) {
          statusText.textContent = "音声の準備中...";
          await new Promise(r => setTimeout(r, 1500));
          return speakAI(text, onEnd, retries - 1);
        }
        statusText.textContent = "音声を再生できませんでした";
        isSpeaking = false;
        if (isModelReady) {
          micBtn.disabled = false;
          micBtn.classList.remove("opacity-50");
        }
        if (onEnd) onEnd();
      }
    }

    function updateProgress(p, label) {
      progressBar.style.width = p + "%";
      progressText.textContent = label;
    }

    micBtn.addEventListener("click", () => {
      if (!isModelReady || isSpeaking) return;
      if (isRecording) stopRecording();
      else startRecording();
    });

    viewResultBtn.addEventListener("click", () => {
      document.getElementById("scanScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.remove("hidden");
    });

    loadModel();
  </script>
</body>
