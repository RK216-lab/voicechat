<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ケア - Restee</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="care">
    <div class="phone-bezel">
        <div class="wave-bg"></div><div class="wave-bg-2"></div>
        <header class="p-6 pb-2 flex justify-between items-center relative z-10 w-full pt-8">
            <h1 class="text-xl font-bold text-gray-800 tracking-wider">ケア</h1>
            <div id="dominant-badge" class="text-xs bg-white/70 px-3 py-1 rounded-full font-bold text-gray-500 border border-white/60"></div>
        </header>
        <main class="scrollable-content px-6 flex flex-col relative z-10 w-full pt-2">
            <div class="w-full bg-white/70 backdrop-blur-md rounded-2xl px-4 py-3 flex items-center shadow-sm border border-white/80 mb-5 shrink-0">
                <span class="material-icons-outlined text-gray-400 mr-2">search</span>
                <input type="text" placeholder="あなたに合ったケアを検索" class="bg-transparent border-none outline-none text-sm text-gray-700 w-full placeholder-gray-400 font-bold">
            </div>
            <h2 class="text-base font-bold text-gray-800 mb-4 tracking-wider">Rimiさんへのおすすめ</h2>
            <!-- care-listは空でOK -->
            <div id="care-list" class="flex flex-col gap-6 pb-6"></div>
<!-- 読み込み順、これが重要 -->
<script src="js/app.js"></script>
<script src="js/restDB.js"></script>
<script src="js/care.js"></script> <!-- 新規DB版 -->
<!-- 旧 js/script.js は削除 or care.jsの後に -->
        </main>
        <nav class="global-nav">
            <a href="home.html" class="flex flex-col items-center transition text-gray-400 hover:text-green-500"><span class="material-icons-outlined text-3xl">home</span><span class="text-xs mt-1">ホーム</span></a>
            <a href="learn.html" class="flex flex-col items-center transition text-gray-400 hover:text-green-500"><span class="material-icons-outlined text-3xl">import_contacts</span><span class="text-xs mt-1">知る</span></a>
            <a href="scan.html" class="flex flex-col items-center -mt-10 group"><div class="scan-button-gradient w-16 h-16 rounded-full flex items-center justify-center text-white border-4 border-white relative shadow-lg"><span class="material-icons-outlined text-3xl transform scale-110 group-hover:scale-125 transition duration-300">waves</span></div><span class="text-xs mt-1 font-bold text-gray-400 group-hover:text-green-500 transition">スキャン</span></a>
            <a href="care.html" class="flex flex-col items-center transition text-green-500 font-bold"><span class="material-icons-outlined text-3xl">favorite_border</span><span class="text-xs mt-1">ケア</span></a>
            <a href="profile.html" class="flex flex-col items-center transition text-gray-400 hover:text-green-500"><span class="material-icons-outlined text-3xl">person_outline</span><span class="text-xs mt-1">私</span></a>
        </nav>
        <div id="care-modal"><div class="modal-overlay" onclick="closeModal()"></div><div class="modal-content"><div class="relative h-48 w-full bg-gray-200"><img id="modal-image" src="" class="w-full h-full object-cover"><div class="absolute inset-0 flex items-center justify-center bg-black/20"><div class="w-12 h-12 bg-white/80 rounded-full flex items-center justify-center shadow-lg cursor-pointer hover:scale-110 transition"><span class="material-icons-outlined text-green-600 text-3xl ml-1">play_arrow</span></div></div><button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/20 backdrop-blur-md rounded-full flex items-center justify-center text-white border border-white/30"><span class="material-icons-outlined text-sm">close</span></button></div><div class="p-6"><span id="modal-tag" class="inline-block px-2.5 py-1 rounded-md text-xs font-bold text-white mb-2 shadow-sm"></span><h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2 leading-snug"></h3><p id="modal-description" class="text-sm text-gray-500 leading-relaxed mb-6"></p><div class="border-t border-gray-100 pt-5 text-center"><p class="text-sm font-bold text-gray-400 mb-3 ml-1">このケアはどうでしたか？</p><div class="star-rating flex justify-center gap-1 mb-6"><span class="material-icons-outlined text-3xl" onclick="rate(1)">star</span><span class="material-icons-outlined text-3xl" onclick="rate(2)">star</span><span class="material-icons-outlined text-3xl" onclick="rate(3)">star</span><span class="material-icons-outlined text-3xl" onclick="rate(4)">star</span><span class="material-icons-outlined text-3xl" onclick="rate(5)">star</span></div><button onclick="closeModal()" class="w-full py-3.5 bg-green-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-green-100 active:scale-95 transition">閉じる</button></div></div></div></div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded',()=>{
        const last = window.ResteeApp.loadLastScan();
        const badge = document.getElementById('dominant-badge');
        if(last){
          const domType = window.ResteeApp.getDominantType(last.final||last);
          const label = {body:'身体ケア', brain:'脳ケア', mental:'メンタルケア'}[domType]||'';
          if(badge) badge.textContent = label + 'をおすすめ中';
          // 並び替え: 支配的な疲労タイプを先頭に
          const list = document.getElementById('care-list');
          const cards = [...list.querySelectorAll('.wavy-card')];
          cards.sort((a,b)=>{
            const aMatch = a.dataset.type===domType?0:1;
            const bMatch = b.dataset.type===domType?0:1;
            return aMatch-bMatch;
          });
          // 人気タイトルはそのまま残すため一旦クリアしないで再append
          cards.forEach(c=>{ if(c.dataset.type) list.prepend(c); });
        }
      });
    </script>
</body>
</html>
