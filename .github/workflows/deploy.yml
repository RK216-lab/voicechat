name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Environment Variables
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # プレースホルダーをGitHub Secretsの実際の値に安全に置換する
          # パイプ（|）ではなくデリミタを変更して確実に置換
          python3 -c '
          import os
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("__GROQ_API_KEY_PLACEHOLDER__", os.environ["GROQ_API_KEY"])
          content = content.replace("__BACKEND_URL_PLACEHOLDER__", "https://voicechat-gz4j.onrender.com")
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
